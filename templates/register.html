<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản | Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css?v=3.3">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon-circle">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2>Tạo tài khoản mới</h2>
                <p>Khởi tạo không gian quản lý chi tiêu riêng tư của bạn</p>
            </div>

            <div id="auth-alert" class="auth-alert" style="display: none;"></div>

            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="username"><i class="fa-solid fa-user"></i> Tên đăng nhập</label>
                    <input type="text" id="username" name="username" placeholder="Tối thiểu 3 ký tự (a-z, 0-9, _)..." required autocomplete="username" autofocus minlength="3">
                </div>

                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Mật khẩu</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Tối thiểu 6 ký tự..." required autocomplete="new-password" minlength="6">
                        <button type="button" class="btn-toggle-pwd" id="toggle-pwd-btn" tabindex="-1">
                            <i class="fa-regular fa-eye" id="toggle-pwd-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password"><i class="fa-solid fa-shield-halved"></i> Xác nhận mật khẩu</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Nhập lại mật khẩu trên..." required autocomplete="new-password" minlength="6">
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="auth-btn-primary">
                    <span class="btn-text">Đăng ký & Bắt đầu</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Đã có tài khoản? <a href="/login" class="auth-link">Đăng nhập ngay</a></p>
            </div>
        </div>
    </div>

    <script>
        const registerForm = document.getElementById('register-form');
        const submitBtn = document.getElementById('submit-btn');
        const alertBox = document.getElementById('auth-alert');
        const togglePwdBtn = document.getElementById('toggle-pwd-btn');
        const pwdInput = document.getElementById('password');
        const confirmPwdInput = document.getElementById('confirm_password');
        const togglePwdIcon = document.getElementById('toggle-pwd-icon');

        togglePwdBtn.addEventListener('click', () => {
            const isPassword = pwdInput.type === 'password';
            pwdInput.type = isPassword ? 'text' : 'password';
            confirmPwdInput.type = isPassword ? 'text' : 'password';
            togglePwdIcon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
        });

        function showAlert(msg, isError = true) {
            alertBox.textContent = msg;
            alertBox.className = 'auth-alert ' + (isError ? 'auth-alert-error' : 'auth-alert-success');
            alertBox.style.display = 'block';
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';

            const username = document.getElementById('username').value.trim();
            const password = pwdInput.value;
            const confirmPassword = confirmPwdInput.value;

            if (!username || !password || !confirmPassword) {
                showAlert('Vui lòng điền đầy đủ các thông tin.');
                return;
            }

            if (username.length < 3) {
                showAlert('Tên đăng nhập phải có ít nhất 3 ký tự.');
                return;
            }

            if (password.length < 6) {
                showAlert('Mật khẩu phải có ít nhất 6 ký tự.');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Mật khẩu xác nhận không khớp. Vui lòng kiểm tra lại.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Đang khởi tạo tài khoản...';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    showAlert('Tạo tài khoản thành công! Đang chuyển hướng vào bảng điều khiển...', false);
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 600);
                } else {
                    showAlert(data.detail || 'Đăng ký không thành công. Vui lòng thử lại.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span class="btn-text">Đăng ký & Bắt đầu</span> <i class="fa-solid fa-arrow-right"></i>';
                }
            } catch (err) {
                showAlert('Lỗi kết nối máy chủ. Vui lòng thử lại sau.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="btn-text">Đăng ký & Bắt đầu</span> <i class="fa-solid fa-arrow-right"></i>';
            }
        });
    </script>
</body>
</html>
